name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      - run: pnpm check:hardcoded && pnpm check:licenses && pnpm check:contrast
      - name: Start local Supabase for integration tests
        # One retry: pulling the stack's images occasionally fails on a fresh runner.
        run: pnpm exec supabase start || (pnpm exec supabase stop --no-backup && pnpm exec supabase start)
      - name: Apply migrations to the Supabase database
        run: pnpm db:migrate
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: pnpm test
      - run: pnpm build
      - name: Secret scan (gitleaks CLI)
        # A pinned release, downloaded directly and checked against its published checksum: asking the
        # API for "latest" is rate-limited on shared runners and failed a run. Upgrade by changing both.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" gitleaks
          ./gitleaks detect --source . --no-banner --redact

  e2e:
    # Pull requests to main, and phase branches (phases are merged without a PR until the GitHub CLI is set up).
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/phase/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        # One retry: pulling the stack's images occasionally fails on a fresh runner.
        run: pnpm exec supabase start || (pnpm exec supabase stop --no-backup && pnpm exec supabase start)
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Export the local stack's development keys
        run: |
          pnpm exec supabase status -o env | tr -d '"' > supabase.env
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^PUBLISHABLE_KEY=' supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$(grep '^SECRET_KEY=' supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          rm supabase.env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
