packages:
  - apps/*
  - packages/*

# One version per shared tool across the workspace. Major versions are recorded in ADR-001.
allowBuilds:
  esbuild: true
  msw: false
  supabase: true
  unrs-resolver: true

catalog:
  typescript: ~6.0.3
  eslint: ^9.39.0
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@types/node': ^24.0.0
  zod: ^4.6.7
  tsx: ^4.23.15
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0

# sharp bundles libvips (LGPL-3.0-or-later), which is outside the license allow-list (CLAUDE.md §2.2).
# Images are served unoptimized instead; GitHub avatars are requested at their display size.
ignoredOptionalDependencies:
  - sharp
